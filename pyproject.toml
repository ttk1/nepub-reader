[project]
name = "nepub-reader"
version = "0.1.0"
description = "小説家になろう・カクヨムの作品を縦書き表示で快適に読めるリーダー"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "nepub @ git+https://github.com/ttk1/nepub.git@382ffea7c1fd121ea20e62d7129087726120a703",
]

[project.scripts]
nepub-reader = "nepub_reader.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

# 点検のルールを固定する（ruff の版が上がって既定のルールが変わっても、結果が変わらないように）
[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "UP"]
