# push と PR のたびにテストを実行する。アクションとイメージは固定する（更新の手順は CLAUDE.md の「サプライチェーン対策」）
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: イメージをビルドする
        run: docker build -t nepub-reader .

      - name: サーバーのテスト
        run: docker run --rm -v "$PWD:/src:ro" -w /src nepub-reader /app/.venv/bin/python -B -m unittest discover -s tests

      - name: 読書履歴（history.js）のテスト
        run: docker run --rm -v "$PWD:/src:ro" -w /src node:24.22.2-slim@sha256:01d566e8d94d8c619591d78652babfccd3c6992a3dffa9ed5ab39e11cf6c70e9 node --test tests/history.test.mjs
